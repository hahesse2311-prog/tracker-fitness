<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIT TRACKER 2026</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0b0d10;--card:#151a20;--bd:#232a33;--tx:#f2f5f7;--mu:#8a96a3;--g:#22c55e;--b:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--bd);background:#0e1115}
nav h1{font-size:15px;letter-spacing:2px;margin:4px 10px 18px}nav h1 span{color:var(--g)}
nav button{display:flex;gap:10px;width:100%;padding:11px 12px;margin:2px 0;border:0;border-radius:12px;background:none;color:var(--mu);font:inherit;cursor:pointer;text-align:left}
nav button.on{background:#1b222b;color:#fff}
main{padding:24px;max-width:860px;width:100%;margin:auto;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 8px;font-size:12px;letter-spacing:1.5px;color:var(--mu);font-weight:600}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.bar{height:10px;background:#222a33;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#4ade80);transition:width .4s}
.it{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;cursor:pointer;transition:.2s;background:#11161c}
.it .bx{width:22px;height:22px;border:2px solid #3a4553;border-radius:7px;flex:none;display:grid;place-items:center;color:#06210f;font-size:14px;font-weight:700}
.it.on{border-color:#1d6b3a;background:#10241a;color:#9fb8a8}.it.on span{text-decoration:line-through}.it.on .bx{background:var(--g);border-color:var(--g)}.it.on .bx:after{content:'✓'}
.it em{margin-left:auto;font-size:11px;color:var(--b);font-style:normal}
button.pri,button.sec{border:0;padding:12px 16px;border-radius:12px;font:600 14px system-ui;cursor:pointer;margin:4px 6px 4px 0}
button.pri{background:var(--g);color:#05210e}button.sec{background:#1f2730;color:var(--tx)}button:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal>b{text-align:center;color:var(--mu);font-size:12px}
.cd{aspect-ratio:1;border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);cursor:pointer;transition:.2s}
.cd:hover{border-color:var(--b)}.cd.out{opacity:.22;cursor:default;background:none}.cd.now{outline:2px solid var(--b)}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block}.dt.g{background:var(--g)}.dt.y{background:#eab308}.dt.r{background:#ef4444}.dt.w{background:#cbd5e1}.dt.f{border:1.5px solid var(--b)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:20px;background:#1f2730;border:1px solid var(--bd);cursor:pointer;font-size:13px}.chip.on{background:var(--b);border-color:var(--b)}
input[type=time],input[type=text]{background:#0e1115;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit}
.wx{padding:12px;border-radius:12px;background:#0f1a2b;border:1px solid #1e3a5f}.wx.bad{background:#2a1a0f;border-color:#6b3a1d}
details summary{cursor:pointer;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--g);color:#05210e;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:9}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);z-index:5}nav h1{display:none}nav button{flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px;text-align:center}main{padding:calc(16px + env(safe-area-inset-top)) 14px 100px}}
</style></head><body>
<div id="app"><nav><h1>FIT <span>TRACKER</span> 2026</h1>
<button data-a="nav" data-v="home">🏠 Inicio</button><button data-a="nav" data-v="cal">📅 Calendario</button><button data-a="nav" data-v="train">💪 Entrenamiento</button><button data-a="nav" data-v="stats">📊 Progreso</button><button data-a="nav" data-v="sett">⚙️ Ajustes</button></nav>
<main id="main"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0');
const D0=new Date(2026,9,3),K0='2026-10-03',K1='2026-12-31';
const key=d=>`${d.getFullYear()}-${P(d.getMonth()+1)}-${P(d.getDate())}`;
const dk=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const tk=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const clamp=k=>k<K0?K0:k>K1?K1:k;
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],DC=['D','L','M','X','J','V','S'];
const INT=['','🟢 Recuperación','🔵 Ligero','🟡 Moderado','🟠 Intenso','🔴 Muy intenso'];
const IC={car:'🏃',fz:'💪',pie:'🦵',core:'🔥',mov:'🧘',fut:'⚽'};
const ALT={car:'Cardio indoor (saltos, step, bici estática)',fut:'Circuito indoor de footwork y agilidad'};
const MSG=['Entrenamiento completado.','Otro día cumplido.','Vas construyendo constancia.','Sesión completada.'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f12=t=>{const h=+t.slice(0,2);return `${h%12||12}:${t.slice(3)} ${h<12?'AM':'PM'}`};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
// ---- Plan: [tipo, nombre, valor, clase(m=min,s=series×reps,t=series×seg,r=repeticiones), exterior]
const W=[
{f:'Piernas activas + cardio ligero',i:2,a:[['car','Caminata / cardio ligero',30,'m',1],['pie','Sentadilla sin carga',12,'s'],['pie','Puente de glúteo',12,'s'],['pie','Zancadas hacia atrás',10,'s'],['mov','Estiramiento completo',10,'m']]},
{f:'Fútbol: aceleración y cambios de dirección',i:4,a:[['mov','Calentamiento dinámico',10,'m'],['fut','Aceleraciones cortas 15 m',6,'r',1],['fut','Cambios de dirección (T / zigzag)',6,'r',1],['fut','Escalera de agilidad / coordinación',8,'m'],['core','Dead bug',10,'s'],['mov','Vuelta a la calma y estiramiento',8,'m']]},
{f:'Fuerza tren superior + core',i:3,a:[['mov','Calentamiento articular',8,'m'],['fz','Flexiones',10,'s'],['fz','Remo con mochila o banda',12,'s'],['fz','Fondos en silla',8,'s'],['core','Plancha lateral',25,'t'],['core','Bird-dog',10,'s']]},
{f:'Descanso / recuperación activa',i:1,rest:1,a:[['car','Caminata ligera (opcional)',20,'m',1],['mov','Estiramiento suave (opcional)',10,'m'],['mov','Hidratación y sueño de calidad',1,'m']]},
{f:'Fuerza de piernas',i:4,a:[['mov','Movilidad de tobillos y cadera',10,'m'],['pie','Sentadilla',12,'s'],['pie','Zancadas caminando',10,'s'],['pie','Peso muerto rumano',10,'s'],['pie','Elevación de talones',15,'s'],['core','Plancha',30,'t']]},
{f:'Fútbol técnico + core',i:2,a:[['mov','Calentamiento',8,'m'],['fut','Conducción y pases con balón',20,'m',1],['fut','Coordinación y toques',10,'m'],['core','Plancha',30,'t'],['mov','Movilidad de cadera',8,'m']]},
{f:'Cardio + tren superior + core',i:3,a:[['car','Cardio continuo (trote / bici)',30,'m',1],['fz','Flexiones',10,'s'],['fz','Press de hombros con mochila',10,'s'],['core','Plancha',30,'t'],['mov','Movilidad de cadera y tobillos',10,'m']]}];
const PL={};
function plan(k){if(PL[k])return PL[k];const d=dk(k),idx=Math.round((d-D0)/864e5),w=Math.floor(idx/7),ph=d.getMonth()-9,dl=w%4==3,T=W[d.getDay()];
const mu=(1+.04*w)*(dl?.8:1),sets=Math.max(2,(ph?3:2)-(dl?1:0));
const items=T.a.map((r,n)=>{const[t,name,v,kd,out]=r;let s;
if(kd=='m'){const m=v>=20?Math.round(v*mu/5)*5:Math.max(v,Math.round(v*mu));s=m+' min'}
else if(kd=='s')s=sets+' × '+(v+ph-(dl?1:0));
else if(kd=='t')s=sets+' × '+(v+5*ph-(dl?5:0))+' s';
else s=(v+Math.floor(w/2)-(dl?1:0))+' repeticiones';
return{id:t+n,t,name,suf:s,out:!!out,min:kd=='m'?parseInt(s):0}});
let i=T.i;if(ph==0&&i>3)i=3;if(dl)i=Math.max(1,i-1);
return PL[k]={k,f:T.f,i,rest:!!T.rest,items,obj:['Adaptación y hábito','Aumento gradual','Consolidación y rendimiento'][ph]+(dl?' · semana de descarga':'')}}
// ---- Estado
let S;try{S=JSON.parse(localStorage.ft26||'null')}catch(e){}
S=S||{done:{},alarms:[{id:1,days:[1,3,5],time:'16:00',label:'Entrenamiento',on:true},{id:2,days:[6],time:'10:00',label:'Fútbol',on:true}],set:{}};
S.set=Object.assign({rem:true,tTrain:true,tChk:true,chkTime:'17:00',chkDays:[0,1,2,3,4,5,6]},S.set);
const save=()=>{try{localStorage.ft26=JSON.stringify(S)}catch(e){}};
let V='home',SEL=null,CM={y:2026,m:9},ED=null,DP=null;
const selk=()=>SEL||clamp(key(tk()));
function prog(k){const it=plan(k).items,dn=S.done[k]||{},n=it.filter(x=>dn[x.id]).length;return{n,t:it.length,pct:Math.round(n/it.length*100)}}
// ---- Clima (Open-Meteo, sin API key)
const WURL='https://api.open-meteo.com/v1/forecast?latitude=14.8347&longitude=-91.5181&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FGuatemala&forecast_days=16';
let WX={};try{WX=JSON.parse(localStorage.ft26wx||'{}').d||{}}catch(e){}
async function loadWX(){try{const c=JSON.parse(localStorage.ft26wx||'{}');if(c.t&&Date.now()-c.t<36e5)return;const j=await(await fetch(WURL)).json(),o={};
j.daily.time.forEach((t,i)=>o[t]={c:j.daily.weathercode[i],tx:Math.round(j.daily.temperature_2m_max[i]),tn:Math.round(j.daily.temperature_2m_min[i]),pp:j.daily.precipitation_probability_max[i]||0});
WX=Object.assign(WX,o);localStorage.ft26wx=JSON.stringify({t:Date.now(),d:WX});render()}catch(e){}}
function wx(k){const r=WX[k];if(!r)return null;const c=r.c;let ic='🌤️',bad=0,why='';
if(c>=95){ic='⛈️';bad=1;why='tormenta'}else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c)||r.pp>=50){ic='🌧️';bad=1;why='lluvia probable'}else if(c<=1)ic='☀️';else if(c==2)ic='⛅';else if(c==3)ic='☁️';else if(c==45||c==48)ic='🌫️';
if(r.tx>=32){bad=1;ic='🥵';why=why||'calor'}if(r.tx<=10){bad=1;why=why||'mucho frío'}
return{...r,ic,bad,why}}
function eff(k){const p=plan(k),w=wx(k);return{p,w,items:p.items.map(x=>w&&w.bad&&x.out?{...x,name:ALT[x.t],alt:1}:x)}}
function wxHtml(k,full){const w=wx(k);if(!w)return`<div class="wx">🌐 Pronóstico disponible solo para los próximos 16 días (o sin conexión). Se usa el plan original.</div>`;
return`<div class="wx ${w.bad?'bad':''}"><b>${w.ic} ${w.tx}°C</b> <span class="mu">(mín ${w.tn}°C${full?' · Probabilidad de lluvia: '+w.pp+'%':''})</span><br>${w.bad?'Recomendación: hacer entrenamiento indoor ('+w.why+').':'Buen clima para entrenar afuera.'}</div>`}
// ---- Estadísticas
function st(){const tn=key(tk()),a={tr:0,rs:0,di:0,pe:0,car:0,fz:0,fut:0,cur:0,best:0,pl:0,wk:[],mo:{}};
for(let n=0;n<90;n++){const d=addD(D0,n),k=key(d);if(k>tn)break;const p=plan(k),dn=S.done[k]||{},g=prog(k),w=Math.floor(n/7),m=k.slice(0,7);let fz=0,fu=0;
p.items.forEach(x=>{if(dn[x.id]){a.di++;if(x.t=='car')a.car+=x.min;if(x.t=='fz'||x.t=='pie')fz=1;if(x.t=='fut')fu=1}});a.fz+=fz;a.fut+=fu;
const WK=a.wk[w]=a.wk[w]||{n:0,t:0,d},M=a.mo[m]=a.mo[m]||{n:0,t:0,dd:0,pl:0};
if(p.rest){a.rs++;continue}
a.pl++;M.pl++;WK.n+=g.n;WK.t+=g.t;M.n+=g.n;M.t+=g.t;
if(g.pct==100){a.tr++;M.dd++;a.cur++;a.best=Math.max(a.best,a.cur)}else{a.pe+=g.t-g.n;if(k<tn)a.cur=0}}
return a}
// ---- Vistas
function items(k,its){const dn=S.done[k]||{};return its.map(x=>`<div class="it ${dn[x.id]?'on':''}" data-a="tog" data-k="${k}" data-i="${x.id}"><b class="bx"></b><span>${IC[x.t]} ${x.name} — ${x.suf}</span>${x.alt?'<em>indoor</em>':''}</div>`).join('')}
function home(){const k=clamp(key(tk())),d=dk(k),{p,w,items:its}=eff(k),g=prog(k),h=new Date().getHours(),s=st(),dn=S.done[k]||{},nx=its.find(x=>!dn[x.id]),
al=S.alarms.filter(a=>a.on&&a.days.includes(d.getDay())).sort((x,y)=>x.time<y.time?-1:1)[0],t=key(tk());
return`<h2>${h<12?'BUENOS DÍAS':h<19?'BUENAS TARDES':'BUENAS NOCHES'}</h2><p class="mu">${t<K0?'Tu plan inicia el 3 de octubre de 2026.':t>K1?'El plan terminó el 31 de diciembre de 2026.':DS[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]+' · '+INT[p.i]}</p>
<div class="card"><h3>${p.rest?'DÍA DE RECUPERACIÓN':'ENTRENAMIENTO DE HOY'} · ${esc(p.f)}</h3>${bar(g.pct)}<b>${g.pct}%</b> <span class="mu">· ${g.n} / ${g.t} actividades</span></div>
<div class="grid"><div class="card"><h3>PRÓXIMA ACTIVIDAD</h3>${nx?`<div class="big" style="font-size:20px">${IC[nx.t]} ${esc(nx.name)}</div><div class="mu">${nx.suf}${al?' · ⏰ '+f12(al.time):''}</div>`:'<b>✅ Todo completado</b>'}</div>
<div class="card"><h3>CLIMA</h3>${wxHtml(k)}</div><div class="card"><h3>RACHA</h3><div class="big">🔥 ${s.cur} días</div></div></div>
<div class="card"><h3>HOY</h3>${items(k,its)}</div>`}
function train(){const k=selk(),d=dk(k),{p,w,items:its}=eff(k),g=prog(k),bad=w&&w.bad&&p.items.some(x=>x.out);
return`<div class="row"><button class="sec" data-a="dd" data-d="-1" ${k<=K0?'disabled':''}>←</button><h2>${(DS[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()]).toUpperCase()}</h2><button class="sec" data-a="dd" data-d="1" ${k>=K1?'disabled':''}>→</button></div>
<div class="card"><h3>🌤️ CLIMA</h3>${wxHtml(k,1)}${bad?`<p><b>PLAN ORIGINAL:</b> <span class="mu">${p.items.filter(x=>x.out).map(x=>x.name).join(' · ')}</span><br><b>ALTERNATIVA 🏠:</b> <span class="mu">${its.filter(x=>x.alt).map(x=>x.name+' — '+x.suf).join(' · ')}</span></p>`:''}</div>
<div class="card"><h3>🎯 OBJETIVO</h3><b>${esc(p.f)}</b><div class="mu">${p.obj} · ${INT[p.i]}</div></div>
${p.rest?`<div class="card"><b>😴 DÍA DE RECUPERACIÓN</b><p class="mu">No entrenamiento intenso. Opcional: caminata ligera, estiramiento, movilidad. No cuenta como día perdido.</p>${items(k,its)}</div>`:`<div class="card"><h3>ACTIVIDADES</h3>${items(k,its)}<h3 style="margin-top:14px">PROGRESO</h3>${bar(g.pct)}<b>${g.pct}%</b> <span class="mu">· ${g.n} de ${g.t} completadas</span><br><button class="pri" data-a="all" data-k="${k}">${g.pct==100?'DESMARCAR TODO':'MARCAR TODO COMO COMPLETADO'}</button></div>`}
<p class="mu">💧 Hidrátate · 🔥 Calienta antes · ⛔ Detente ante dolor fuerte o síntomas preocupantes.</p>`}
function cal(){const{y,m}=CM,off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),tn=key(tk()),ix=(y-2026)*12+m,nm=i=>MES[(i%12+12)%12];let c='';
for(let i=0;i<off;i++)c+='<div></div>';
for(let d=1;d<=n;d++){const k=`${y}-${P(m+1)}-${P(d)}`,ok=k>=K0&&k<=K1;let dot='';
if(ok){const p=plan(k),g=prog(k);dot=p.rest?'w':k>tn?'f':g.pct==100?'g':g.n?'y':'r'}
c+=`<div class="cd ${ok?'':'out'} ${k==tn?'now':''}" ${ok?`data-a="day" data-k="${k}"`:''}><span>${d}</span>${ok?`<i class="dt ${dot}"></i>`:''}</div>`}
return`<div class="row"><button class="sec" data-a="cm" data-d="-1" ${ix<=8?'disabled':''}>← ${nm(m-1)}</button><h2>${MES[m]} ${y}</h2><button class="sec" data-a="cm" data-d="1" ${ix>=12?'disabled':''}>${nm(m+1)} →</button></div>
<div class="card"><div class="cal">${DC.slice(1).concat('D').map(x=>`<b>${x}</b>`).join('')}${c}</div></div>
<p class="mu"><i class="dt g"></i> Completado &nbsp;<i class="dt y"></i> Parcial &nbsp;<i class="dt r"></i> Pendiente &nbsp;<i class="dt w"></i> Descanso &nbsp;<i class="dt f"></i> Programado<br>Plan: 03/10/2026 → 31/12/2026 (fechas atenuadas = fuera del plan).</p>`}
function stats(){const s=st(),mk=key(tk()).slice(0,7),M=s.mo[mk]||{dd:0,pl:0},pc=s.pl?Math.round(s.tr/s.pl*100):0;
const c=(t,v,x)=>`<div class="card"><h3>${t}</h3><div class="big">${v}</div><div class="mu">${x||''}</div></div>`;
return`<h2>Progreso</h2><p class="mu">Los descansos programados no rompen la racha ni cuentan como perdidos.</p><div class="grid">
${c('🔥 RACHA',s.cur+' días','Mejor racha: '+s.best)}${c('📅 ESTE MES',M.dd+' / '+M.pl,'días completados')}${c('✅ CUMPLIMIENTO',pc+'%','días de entrenamiento')}
${c('DÍAS ENTRENADOS',s.tr)}${c('DÍAS DESCANSADOS',s.rs)}${c('ACTIVIDADES',s.di,s.pe+' pendientes')}
${c('🏃 CARDIO',s.car+' min')}${c('💪 FUERZA',s.fz+' sesiones')}${c('⚽ FÚTBOL',s.fut+' sesiones')}</div>
<div class="card"><h3>PROGRESO SEMANAL</h3>${s.wk.map((w,i)=>w?`<div class="row"><span class="mu">Sem ${i+1} · ${w.d.getDate()} ${MES[w.d.getMonth()].slice(0,3)}</span><b>${w.t?Math.round(w.n/w.t*100):0}%</b></div>${bar(w.t?Math.round(w.n/w.t*100):0)}`:'').join('')||'<span class="mu">Aún sin datos.</span>'}</div>
<div class="card"><h3>PROGRESO MENSUAL</h3>${Object.keys(s.mo).map(m=>{const o=s.mo[m],p=o.t?Math.round(o.n/o.t*100):0;return`<div class="row"><span>${MES[+m.slice(5)-1]}</span><b>${p}%</b></div>${bar(p)}`}).join('')||'<span class="mu">Aún sin datos.</span>'}</div>`}
const chips=(sel,act)=>[1,2,3,4,5,6,0].map(d=>`<span class="chip ${sel.includes(d)?'on':''}" data-a="${act}" data-d="${d}">${DC[d]}</span>`).join(' ');
function sett(){const ok='Notification' in window,pm=ok?Notification.permission:'no';
const form=ED?`<div class="card" style="border-color:var(--b)"><h3>${ED.id?'EDITAR':'NUEVA'} ALARMA</h3>${chips(ED.days,'edd')}<p><input type="time" data-f="time" value="${ED.time}"> <input type="text" data-f="label" value="${esc(ED.label)}" maxlength="40"></p><button class="pri" data-a="asave">Guardar</button><button class="sec" data-a="acancel">Cancelar</button></div>`:'';
return`<h2>Ajustes</h2>
<div class="card"><h3>⏰ MIS ALARMAS</h3>${S.alarms.map(a=>`<div class="row" style="margin:8px 0"><span>${a.days.map(d=>DS[d].slice(0,3)).join(', ')} · <b>${f12(a.time)}</b> — ${esc(a.label)}</span><span><input type="checkbox" data-a="atog" data-id="${a.id}" ${a.on?'checked':''}> <button class="sec" data-a="edit" data-id="${a.id}">✏️</button><button class="sec" data-a="adel" data-id="${a.id}">🗑️</button></span></div>`).join('')||'<span class="mu">Sin alarmas.</span>'}${form}<button class="pri" data-a="new">+ Crear alarma</button></div>
<div class="card"><h3>🔔 RECORDATORIOS</h3>
<label><input type="checkbox" data-s="rem" ${S.set.rem?'checked':''}> Recordatorios activados</label><br>
<label><input type="checkbox" data-s="tTrain" ${S.set.tTrain?'checked':''}> «Hora de entrenar 💪» (según tus alarmas)</label><br>
<label><input type="checkbox" data-s="tChk" ${S.set.tChk?'checked':''}> «¿Ya terminaste?» solo si hay actividades pendientes, a las</label> <input type="time" data-s="chkTime" value="${S.set.chkTime}"><p>${chips(S.set.chkDays,'cd')}</p>
<p class="mu">Máximo un aviso por alarma y uno de revisión por día.</p>
<p>Permiso: <b>${pm=='granted'?'✅ concedido':pm=='denied'?'⛔ bloqueado (cámbialo en ajustes del navegador)':pm=='no'?'no soportado en este navegador':'sin pedir'}</b></p>
${ok?`<button class="pri" data-a="perm">Activar notificaciones</button><button class="sec" data-a="test">Probar</button>`:''}${DP?'<button class="sec" data-a="inst">📲 Instalar app</button>':''}
<p class="mu"><b>Limitación:</b> una web/PWA no puede crear alarmas del sistema. Los avisos se disparan mientras la app está abierta o el navegador la mantiene activa en segundo plano; con la app cerrada no se garantizan (requeriría un servidor Push o app nativa). En iPhone solo funcionan si la instalas en la pantalla de inicio (iOS 16.4+). Para avisos fiables, exporta al calendario (abajo): ese sí suena aunque cierres la app.</p></div>
<div class="card"><h3>📆 CALENDARIO DEL TELÉFONO</h3><button class="pri" data-a="ics">Exportar entrenamientos (.ics)</button><p class="mu">Crea un evento por día de entrenamiento con aviso 15 min antes, a la hora de tu primera alarma de ese día (16:00 si no hay).</p></div>
<div class="card"><h3>🛟 SEGURIDAD</h3><p class="mu">El descanso es parte del entrenamiento · Hidrátate · Calienta antes de entrenar · Detente ante dolor fuerte o síntomas preocupantes (mareo, dolor de pecho, falta de aire) · Adapta la carga a tu nivel real.</p></div>
<div class="card"><details><summary>📋 Plan completo 3 oct – 31 dic 2026</summary>${Array.from({length:90},(_,n)=>{const d=addD(D0,n),p=plan(key(d));return`<div class="mu" style="padding:3px 0">${DS[d.getDay()].slice(0,3)} ${d.getDate()} ${MES[d.getMonth()].slice(0,3)} · ${INT[p.i].split(' ')[0]} ${esc(p.f)}</div>`}).join('')}</details></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V));$('#main').innerHTML=({home,cal,train,stats,sett})[V]()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
// ---- Eventos
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,k=t.dataset.k,d=+t.dataset.d,id=+t.dataset.id;
if(a=='nav'){V=t.dataset.v;SEL=null;if(V=='cal'){const c=clamp(key(tk()));CM={y:+c.slice(0,4),m:+c.slice(5,7)-1}}}
else if(a=='tog'){const b=prog(k).pct;S.done[k]=S.done[k]||{};S.done[k][t.dataset.i]=!S.done[k][t.dataset.i];save();if(b<100&&prog(k).pct==100&&!plan(k).rest)toast(MSG[Math.floor(Math.random()*4)])}
else if(a=='all'){const full=prog(k).pct==100;S.done[k]={};if(!full)plan(k).items.forEach(x=>S.done[k][x.id]=true);save();if(!full)toast(MSG[0])}
else if(a=='day'){SEL=k;V='train'}
else if(a=='dd'){SEL=clamp(key(addD(dk(selk()),d)))}
else if(a=='cm'){const i=(CM.y-2026)*12+CM.m+d;CM={y:2026+Math.floor(i/12),m:(i%12+12)%12}}
else if(a=='new')ED={id:0,days:[1,3,5],time:'16:00',label:'Entrenamiento'};
else if(a=='edit'){const o=S.alarms.find(x=>x.id==id);ED={...o,days:[...o.days]}}
else if(a=='edd'){ED.days=ED.days.includes(d)?ED.days.filter(x=>x!=d):ED.days.concat(d)}
else if(a=='acancel')ED=null;
else if(a=='asave'){if(!ED.days.length||!ED.time)return toast('Elige al menos un día y una hora');if(ED.id)S.alarms=S.alarms.map(x=>x.id==ED.id?ED:x);else S.alarms.push({...ED,id:Date.now(),on:true});ED=null;save()}
else if(a=='adel'){if(confirm('¿Eliminar alarma?')){S.alarms=S.alarms.filter(x=>x.id!=id);save()}}
else if(a=='cd'){const c=S.set.chkDays;S.set.chkDays=c.includes(d)?c.filter(x=>x!=d):c.concat(d);save()}
else if(a=='perm'){Notification.requestPermission().then(render);return}
else if(a=='test'){notify('Hora de entrenar 💪','Notificación de prueba');return}
else if(a=='inst'){DP.prompt();DP=null}
else if(a=='ics'){ics();return}
else if(a=='atog')return;
render()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a=='atog'){S.alarms.find(x=>x.id==t.dataset.id).on=t.checked;save()}
else if(t.dataset.s){S.set[t.dataset.s]=t.type=='checkbox'?t.checked:t.value;save()}});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f&&ED)ED[f]=e.target.value});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(V=='sett')render()});
// ---- Notificaciones
function notify(title,body){toast(title);if(!('Notification' in window)||Notification.permission!=='granted')return;
const o={body,icon:'icon-192.png',badge:'icon-192.png',tag:'ft26'};
(navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve()).then(r=>r?r.showNotification(title,o):new Notification(title,o)).catch(()=>{})}
const FIRED={};
function tick(){const n=new Date(),k=key(n);if(k<K0||k>K1||!S.set.rem)return;const hm=P(n.getHours())+':'+P(n.getMinutes()),wd=n.getDay(),p=plan(k);
if(S.set.tTrain)S.alarms.forEach(a=>{const f=k+a.id+a.time;if(a.on&&a.days.includes(wd)&&a.time==hm&&!FIRED[f]){FIRED[f]=1;notify('Hora de entrenar 💪',a.label+(p.rest?' · hoy es día de recuperación':' · '+p.f))}});
if(S.set.tChk&&S.set.chkDays.includes(wd)&&S.set.chkTime==hm&&!FIRED[k+'c']){FIRED[k+'c']=1;const dn=S.done[k]||{},pe=eff(k).items.filter(x=>!dn[x.id]);if(!p.rest&&pe.length)notify('¿Ya terminaste tu entrenamiento de hoy?','Te falta completar: '+pe.map(x=>x.name.split(' (')[0]).join(', '))}}
setInterval(tick,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
// ---- Exportar .ics
function ics(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FitTracker2026//ES','CALSCALE:GREGORIAN'];
for(let n=0;n<90;n++){const d=addD(D0,n),k=key(d),p=plan(k);if(p.rest)continue;
const al=S.alarms.filter(a=>a.on&&a.days.includes(d.getDay())).sort((x,y)=>x.time<y.time?-1:1)[0],t=(al?al.time:'16:00').replace(':','');
L.push('BEGIN:VEVENT',`UID:ft26-${k}@fittracker`,`DTSTAMP:${k.replace(/-/g,'')}T000000Z`,`DTSTART:${k.replace(/-/g,'')}T${t}00`,'DURATION:PT45M',`SUMMARY:FIT ${p.f.replace(/[,;]/g,' ')}`,`DESCRIPTION:${p.items.map(x=>x.name+' - '+x.suf).join('\\n').replace(/[,;]/g,' ')}`,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Hora de entrenar','TRIGGER:-PT15M','END:VALARM','END:VEVENT')}
L.push('END:VCALENDAR');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='fit-tracker-2026.ics';a.click();toast('Archivo .ics generado')}
// ---- Inicio
if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();loadWX();tick();
</script></body></html>
