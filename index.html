<style>
:root{--r:#E50914;--dr:#B00000;--y:#FFD400;--o:#FFB000;--mu:#8d8d8d;--sm:#D0D0D0}

body{margin:0;color:#fff;font:300 17px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(900px 520px at 80% -10%,rgba(229,9,20,.22),transparent 60%),repeating-linear-gradient(115deg,transparent 0 56px,rgba(229,9,20,.035) 56px 57px),#050505;background-attachment:fixed;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body:after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(255,212,0,.4);opacity:0;z-index:20}body.zap:after{animation:zap .7s ease-out}@keyframes zap{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

h2{font-size:clamp(36px,6vw,64px);font-weight:700;line-height:1;margin:0 0 14px}h2.giant{font-size:clamp(46px,8vw,104px);line-height:.95}

button.pri,button.sec{font:600 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border:0;transition:transform .15s,box-shadow .2s,color .2s}
button.pri{background:var(--r);color:#fff;padding:15px 28px;border-radius:30px;margin:8px 8px 8px 0;box-shadow:0 0 22px rgba(229,9,20,.5)}button.pri:hover{box-shadow:0 0 34px rgba(229,9,20,.85),0 0 0 1px var(--y)}

#exlist{margin:14px 0 6px}

.it span{flex:1;font-weight:400;font-size:18px;transition:color .2s}.it small{display:block;color:var(--mu);font-size:13px;font-weight:300}.it:hover span{color:var(--y)}
.it .bx{width:24px;height:24px;border:1.5px solid #555;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;transition:.2s}
.it.on span{color:#777;text-decoration:line-through}.it.on .bx{background:var(--r);border-color:var(--r);box-shadow:0 0 14px var(--r)}.it.on .bx:after{content:'✓'}

.hrow{display:flex;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid #1c1c1c;cursor:pointer;transition:color .2s}.hrow:hover{color:var(--y)}.hrow .hn{flex:1;color:var(--sm);font-size:15px}.hrow b{font:700 20px Rajdhani,sans-serif}
.ch{width:100%;height:auto;overflow:visible;margin:18px 0}.ch .ln{fill:none;stroke:var(--r);stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--r));stroke-dasharray:2000;stroke-dashoffset:2000;transition:stroke-dashoffset 1.6s ease-out .3s}.pane:not(.hid) .ch .ln{stroke-dashoffset:0}.ch circle{fill:var(--y);cursor:pointer}
.card{margin:0 0 22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>b{text-align:center;color:var(--mu);font:600 11px Inter,sans-serif;letter-spacing:.1em}
.cd{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:400;cursor:pointer;transition:color .15s}.cd:hover{color:var(--r)}.cd.out{opacity:.18;pointer-events:none}.cd.now{box-shadow:inset 0 0 0 1px var(--y)}
.dt{width:7px;height:7px;border-radius:50%;display:inline-block}.dt.g{background:#fff;box-shadow:0 0 8px var(--y)}.dt.y{background:var(--y)}.dt.r{background:var(--r)}.dt.w{background:#333}.dt.f{border:1.5px solid #666}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.full-history{margin-top:18px;text-align:center}.full-history button{color:var(--sm)}
.s-sett .card{border-top:1px solid #1e1e1e;padding:26px 0 8px;margin:0}.focus{animation:focusPulse 1.15s ease-out}@keyframes focusPulse{0%{background:rgba(229,9,20,.16);box-shadow:0 0 0 0 rgba(229,9,20,.35)}100%{background:transparent;box-shadow:0 0 0 18px rgba(229,9,20,0)}}
.chip{display:inline-block;padding:6px 12px;border-radius:9999px;background:#111;color:var(--mu);font:400 13px Inter,sans-serif;cursor:pointer;transition:.15s}.chip.on{background:var(--r);color:#fff}
input[type=time],input[type=text]{background:#111;color:#fff;border:0;border-radius:12px;padding:10px 14px;font:400 15px Inter,sans-serif}input[type=checkbox]{accent-color:var(--r)}
.wx{color:var(--sm);font-size:14px}.wxMain{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.wxMain b{font:700 clamp(34px,5vw,52px) Rajdhani,Inter,sans-serif;color:#fff;line-height:1}.wxState{font:600 11px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}.wx.bad .wxState{color:var(--y)}.wxMeta{margin-top:8px;color:var(--mu);font-size:13px}.wx.bad .wxMeta{color:#c7b66a}.mu{color:var(--mu);font-size:14px;font-weight:400}
details summary{cursor:pointer;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#0a0a0a;color:#fff;border:1px solid var(--r);padding:12px 22px;border-radius:30px;font:600 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;transition:.25s;z-index:30;box-shadow:0 0 26px rgba(229,9,20,.55)}#toast.show{opacity:1;transform:translate(-50%,0)}
#done{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,rgba(229,9,20,.5),rgba(5,5,5,.94));opacity:0;pointer-events:none;transition:opacity .25s}#done.on{opacity:1}
#done small{font-size:42px}#done b{display:block;font-size:clamp(38px,9vw,92px);letter-spacing:.06em;text-shadow:0 0 30px var(--r)}#done span{font-size:clamp(70px,16vw,160px);line-height:1;color:var(--y);text-shadow:0 0 40px rgba(255,212,0,.6)}
@media(prefers-reduced-motion:reduce){.rv,.pane,.gb,.scr{transition:none;animation:none}}
@media(max-width:800px){body{font-size:16px;text-shadow:0 0 14px #050505}.hero h1{font-size:clamp(58px,20vw,120px)}.xl{font-size:clamp(88px,27vw,170px)}.sub{letter-spacing:.32em}nav{top:auto;bottom:0;justify-content:space-around;gap:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(5,5,5,.95)}nav h1{display:none}nav button{flex-direction:column;gap:2px;font-size:9px;letter-spacing:.08em}nav button i{font-size:15px}nav button.on:after{top:-9px;bottom:auto;left:25%;right:25%}main{padding:0 20px}.vs{padding:50px 0 110px;min-height:100svh}.s-hero{min-height:150vh}.trio{gap:22px}.trio b{font-size:40px}.mid{font-size:38px}#toast{bottom:80px}}
</style></head><body>
<div id="tint"></div><canvas id="bg"></canvas>
<div id="app"><nav><h1><svg width="14" height="20" viewBox="0 0 20 20"><path d="M12 0 L3 11 H9 L7 20 L17 8 H11 Z" fill="#FFD400"/></svg>FIT</h1><button data-a="nav" data-v="hero"><i>01</i>Inicio</button><button data-a="nav" data-v="work"><i>02</i>Entreno</button><button data-a="nav" data-v="chart"><i>03</i>Progreso</button><button data-a="nav" data-v="cal"><i>04</i>Calendario</button><button data-a="nav" data-v="sett"><i>05</i>Ajustes</button></nav>
<main id="main"></main></div><canvas id="warp"></canvas><div id="done"><div><small>⚡</small><b>SESSION COMPLETE</b><span>100%</span></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0');
const D0=new Date(2026,9,3),K0='2026-10-03',K1='2026-12-31';
const key=d=>`${d.getFullYear()}-${P(d.getMonth()+1)}-${P(d.getDate())}`;
const dk=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const tk=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const clamp=k=>k<K0?K0:k>K1?K1:k;
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],DC=['D','L','M','X','J','V','S'];
const INT=['','🟢 Recuperación','🔵 Ligero','🟡 Moderado','🟠 Intenso','🔴 Muy intenso'];
const IC={car:'🏃',fz:'💪',pie:'🦵',core:'🔥',mov:'🧘',fut:'⚽'};
const ALT={car:'Cardio indoor (saltos, step, bici estática)',fut:'Circuito indoor de footwork y agilidad'};
const MSG=['Entrenamiento completado.','Otro día cumplido.','Vas construyendo constancia.','Sesión completada.'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f12=t=>{const h=+t.slice(0,2);return `${h%12||12}:${t.slice(3)} ${h<12?'AM':'PM'}`};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
// ---- Plan: [tipo, nombre, valor, clase(m=min,s=series×reps,t=series×seg,r=repeticiones), exterior]
const W=[
{f:'Piernas activas + cardio ligero',i:2,a:[['car','Caminata / cardio ligero',30,'m',1],['pie','Sentadilla sin carga',12,'s'],['pie','Puente de glúteo',12,'s'],['pie','Zancadas hacia atrás',10,'s'],['mov','Estiramiento completo',10,'m']]},
{f:'Fútbol: aceleración y cambios de dirección',i:4,a:[['mov','Calentamiento dinámico',10,'m'],['fut','Aceleraciones cortas 15 m',6,'r',1],['fut','Cambios de dirección (T / zigzag)',6,'r',1],['fut','Escalera de agilidad / coordinación',8,'m'],['core','Dead bug',10,'s'],['mov','Vuelta a la calma y estiramiento',8,'m']]},
{f:'Fuerza tren superior + core',i:3,a:[['mov','Calentamiento articular',8,'m'],['fz','Flexiones',10,'s'],['fz','Remo con mochila o banda',12,'s'],['fz','Fondos en silla',8,'s'],['core','Plancha lateral',25,'t'],['core','Bird-dog',10,'s']]},
{f:'Descanso / recuperación activa',i:1,rest:1,a:[['car','Caminata ligera (opcional)',20,'m',1],['mov','Estiramiento suave (opcional)',10,'m'],['mov','Hidratación y sueño de calidad',1,'m']]},
{f:'Fuerza de piernas',i:4,a:[['mov','Movilidad de tobillos y cadera',10,'m'],['pie','Sentadilla',12,'s'],['pie','Zancadas caminando',10,'s'],['pie','Peso muerto rumano',10,'s'],['pie','Elevación de talones',15,'s'],['core','Plancha',30,'t']]},
{f:'Fútbol técnico + core',i:2,a:[['mov','Calentamiento',8,'m'],['fut','Conducción y pases con balón',20,'m',1],['fut','Coordinación y toques',10,'m'],['core','Plancha',30,'t'],['mov','Movilidad de cadera',8,'m']]},
{f:'Cardio + tren superior + core',i:3,a:[['car','Cardio continuo (trote / bici)',30,'m',1],['fz','Flexiones',10,'s'],['fz','Press de hombros con mochila',10,'s'],['core','Plancha',30,'t'],['mov','Movilidad de cadera y tobillos',10,'m']]}];
const PL={};
function plan(k){if(PL[k])return PL[k];const d=dk(k),idx=Math.round((d-D0)/864e5),w=Math.floor(idx/7),ph=d.getMonth()-9,dl=w%4==3,T=W[d.getDay()];
const mu=(1+.04*w)*(dl?.8:1),sets=Math.max(2,(ph?3:2)-(dl?1:0));
const items=T.a.map((r,n)=>{const[t,name,v,kd,out]=r;let s;
if(kd=='m'){const m=v>=20?Math.round(v*mu/5)*5:Math.max(v,Math.round(v*mu));s=m+' min'}
else if(kd=='s')s=sets+' × '+(v+ph-(dl?1:0));
else if(kd=='t')s=sets+' × '+(v+5*ph-(dl?5:0))+' s';
else s=(v+Math.floor(w/2)-(dl?1:0))+' repeticiones';
return{id:t+n,t,name,suf:s,out:!!out,min:kd=='m'?parseInt(s):0}});
let i=T.i;if(ph==0&&i>3)i=3;if(dl)i=Math.max(1,i-1);
return PL[k]={k,f:T.f,i,rest:!!T.rest,items,obj:['Adaptación y hábito','Aumento gradual','Consolidación y rendimiento'][ph]+(dl?' · semana de descarga':'')}}
// ---- Estado
let S;try{S=JSON.parse(localStorage.ft26||'null')}catch(e){}
S=S||{done:{},alarms:[{id:1,days:[1,3,5],time:'16:00',label:'Entrenamiento',on:true},{id:2,days:[6],time:'10:00',label:'Fútbol',on:true}],set:{}};
S.set=Object.assign({rem:true,tTrain:true,tChk:true,chkTime:'17:00',chkDays:[0,1,2,3,4,5,6]},S.set);
const save=()=>{try{localStorage.ft26=JSON.stringify(S)}catch(e){}};
let V='hero',SEL=null,CM={y:2026,m:9},ED=null,DP=null,FULLH=false;
const selk=()=>SEL||clamp(key(tk()));
function prog(k){const it=plan(k).items,dn=S.done[k]||{},n=it.filter(x=>dn[x.id]).length;return{n,t:it.length,pct:Math.round(n/it.length*100)}}
// ---- Clima (Open-Meteo, sin API key)
const WURL='https://api.open-meteo.com/v1/forecast?latitude=14.8347&longitude=-91.5181&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FGuatemala&forecast_days=16';
let WX={};try{WX=JSON.parse(localStorage.ft26wx||'{}').d||{}}catch(e){}
async function loadWX(){try{const c=JSON.parse(localStorage.ft26wx||'{}');if(c.t&&Date.now()-c.t<36e5)return;const j=await(await fetch(WURL)).json(),o={};
j.daily.time.forEach((t,i)=>o[t]={c:j.daily.weathercode[i],tx:Math.round(j.daily.temperature_2m_max[i]),tn:Math.round(j.daily.temperature_2m_min[i]),pp:j.daily.precipitation_probability_max[i]||0});
WX=Object.assign(WX,o);localStorage.ft26wx=JSON.stringify({t:Date.now(),d:WX});render()}catch(e){}}
function wx(k){const r=WX[k];if(!r)return null;const c=r.c;let ic='🌤️',bad=0,why='';
if(c>=95){ic='⛈️';bad=1;why='tormenta'}else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c)||r.pp>=50){ic='🌧️';bad=1;why='lluvia probable'}else if(c<=1)ic='☀️';else if(c==2)ic='⛅';else if(c==3)ic='☁️';else if(c==45||c==48)ic='🌫️';
if(r.tx>=32){bad=1;ic='🥵';why=why||'calor'}if(r.tx<=10){bad=1;why=why||'mucho frío'}
return{...r,ic,bad,why}}
function eff(k){const p=plan(k),w=wx(k);return{p,w,items:p.items.map(x=>w&&w.bad&&x.out?{...x,name:ALT[x.t],alt:1}:x)}}
function wxHtml(k,full){const w=wx(k);if(!w)return`<div class="wx"><div class="wxMain"><b>—</b><span class="wxState">FORECAST UNAVAILABLE</span></div><div class="wxMeta">Disponible para los próximos 16 días o cuando vuelva la conexión.</div></div>`;
let state='OUTDOOR TRAINING RECOMMENDED';
if(w.c>=95)state='STORM · INDOOR RECOMMENDED';
else if(w.bad&&w.why==='lluvia probable')state='RAIN EXPECTED · INDOOR RECOMMENDED';
else if(w.bad&&w.why==='calor')state='HIGH TEMPERATURE · ADAPT TRAINING';
else if(w.bad&&w.why==='mucho frío')state='LOW TEMPERATURE · ADAPT TRAINING';

// ---- Estadísticas
